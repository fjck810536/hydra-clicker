<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hydra Clicker — Block 1 Core Tests</title>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 860px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    .pass { font-weight: 700; }
    .fail { font-weight: 700; }
    li { margin: 8px 0; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Phase 3 / Block 1 — Core Tests</h1>
  <p>這個頁面只測 Clock、State、EventBus、Core Runtime；不載入 Babylon.js。</p>
  <p id="summary">Running…</p>
  <ol id="results"></ol>

  <script>
    window.addEventListener('hydra-tests:complete', (event) => {
      const summary = event.detail;
      document.querySelector('#summary').textContent =
        `${summary.passed}/${summary.total} passed · ${summary.failed} failed`;

      const list = document.querySelector('#results');
      for (const result of summary.results) {
        const item = document.createElement('li');
        item.className = result.ok ? 'pass' : 'fail';
        item.textContent = result.ok
          ? `PASS — ${result.name}`
          : `FAIL — ${result.name}: ${result.error?.message ?? 'unknown error'}`;
        list.appendChild(item);
      }
    });
  </script>
  <script type="module" src="./block1-core.test.js"></script>
</body>
</html>
