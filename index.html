<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hydra Clicker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">PROTOTYPE</p>
      <h1>Hydra Clicker</h1>
      <p class="subtitle">拔—灑卡，幹死那頭海德拉！</p>
    </header>

    <section class="hud" aria-label="遊戲狀態">
      <div>
        <span class="hud-label">HEADS</span>
        <strong id="head-count">9</strong>
      </div>
      <div>
        <span class="hud-label">CUTS</span>
        <strong id="cut-count">0</strong>
      </div>
    </section>

    <section class="arena" aria-label="九頭蛇戰場">
      <button id="hydra-target" class="hydra-target" type="button">
        <span class="hydra-placeholder">HYDRA</span>
        <span class="hydra-hint">點擊砍頭</span>
      </button>
    </section>

    <p id="status-line" class="status-line">等待第一次斬擊。</p>
  </main>

  <script src="js/hydra.js"></script>
  <script src="js/heracles.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
