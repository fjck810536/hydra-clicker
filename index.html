<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#09090c" />
  <title>Hydra Clicker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="game-shell" data-app>
    <canvas
      id="battle-canvas"
      class="battle-canvas"
      aria-label="Hydra Clicker battle stage"
    ></canvas>

    <header class="top-hud" aria-label="遊戲狀態">
      <div class="brand-block">
        <span class="eyebrow">HYDRA I · PROTOTYPE</span>
        <strong>Hydra Clicker</strong>
      </div>

      <div class="hud-strip">
        <div class="hud-cell">
          <span class="hud-label">HEADS</span>
          <strong data-hud="heads">9</strong>
        </div>
        <div class="hud-cell">
          <span class="hud-label">CUTS</span>
          <strong data-hud="cuts">0</strong>
        </div>
        <div class="hud-cell">
          <span class="hud-label">NP</span>
          <strong data-hud="np">0%</strong>
        </div>
        <div class="hud-cell">
          <span class="hud-label">AUTO</span>
          <strong data-hud="auto-slash">LOCKED</strong>
        </div>
      </div>
    </header>

    <aside class="test-tools" aria-label="Playtest tools">
      <button class="test-tools-toggle" type="button" data-test-tools-toggle data-fixed-control>
        TEST
      </button>
      <div class="test-tools-panel" data-test-tools-panel hidden>
        <span>REGEN <strong data-test-regen-delay>1500 ms</strong></span>
        <button class="test-reset-button" type="button" data-reset-save data-fixed-control>
          RESET SAVE
        </button>
      </div>
    </aside>

    <div class="anchor-label anchor-label--berserker" aria-hidden="true">
      BERSERKER<br />ANCHOR
    </div>
    <div class="anchor-label anchor-label--hydra" aria-hidden="true">
      HYDRA<br />ANCHOR
    </div>

    <footer class="bottom-hud">
      <div class="meta-strip" aria-label="Master progression">
        <span>KILLS <strong data-hud="kills">0</strong></span>
        <span>人類惡 <strong data-hud="humanity-evil">0</strong></span>
      </div>
      <button class="command-spell-button" type="button" data-command-spell-button data-fixed-control disabled>
        COMMAND SPELL I · LOCKED
      </button>
      <button class="np-button" type="button" data-np-button data-fixed-control disabled>
        NP · 0%
      </button>
      <p class="status-line" data-stage-status>Initializing battle stage…</p>
      <p class="tap-hint">TAP STAGE · MANUAL CUT</p>
      <p class="subtitle">拔—灑卡，幹死那頭海德拉！</p>
    </footer>

    <aside class="landscape-guard" aria-live="polite">
      <strong>PORTRAIT MODE</strong>
      <span>請將裝置轉回直立。</span>
    </aside>
  </main>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
